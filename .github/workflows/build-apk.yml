name: Build & Release

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag (defaults to minimal-mode-preview)'
        required: false
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.9'
  RELEASE_TAG: ${{ github.event.inputs.tag || 'minimal-mode-preview' }}

jobs:
  build:
    name: Analyze, test, build and publish one APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build one installable APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/GymMinimal.apk

      - name: Upload single APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gymminimal-apk
          path: build/app/outputs/flutter-apk/GymMinimal.apk
          if-no-files-found: error

      - name: Point preview tag at this build
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: |
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG" --force

      - name: Remove previous APK assets from the preview release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mapfile -t old_apks < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name | select(endswith(".apk"))')
            for asset in "\${old_apks[@]}"; do
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            done
          fi

      - name: Publish single APK to GitHub Release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: GymMinimal — Minimal Mode
          body: |
            Rolling preview build of the native Minimal Mode implementation.

            Download the single installable APK: GymMinimal.apk
          prerelease: true
          overwrite_files: true
          files: build/app/outputs/flutter-apk/GymMinimal.apk
