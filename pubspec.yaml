name: gymmane
description: "GymMane — an offline, ad-free gym log for Android and iOS."
publish_to: 'none'
version: 1.4.0+5

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  audioplayers: ^6.1.0
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.7
  flutter_local_notifications: ^22.0.1
  home_widget: ^0.7.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  path_drawing: ^1.0.1
  path_provider: ^2.1.6
  phosphoricons_flutter: ^1.0.0
  share_plus: ^12.0.2
  shared_preferences: ^2.3.2
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  video_player: ^2.9.2
  archive: ^4.0.9
  app_settings: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/ic_1024.png"
  adaptive_icon_background: "#0C0B0A"
  adaptive_icon_foreground: "assets/icon/ic_fg_1024.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/img/
    - assets/art/
    - assets/audio/
    - assets/badges/

  shaders:
    - assets/shaders/medal.frag
    - assets/shaders/edge_fade.frag

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
